databases:
  - name: geophysics-ai-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: geophysics-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geophysics-ai-db
          property: connectionString
      - key: ENVIRONMENT
        value: development
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false